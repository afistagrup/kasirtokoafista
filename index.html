<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi POS ATK & Percetakan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-receipt, #printable-receipt * {
                visibility: visible;
            }
            #printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 10px;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased" x-data="posApp()">

    <!-- INDIKATOR LOADING SAAT SINKRONISASI -->
    <div x-show="loading" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl text-center max-w-sm mx-4">
            <div class="inline-block animate-spin text-blue-600 text-3xl mb-3">
                <i class="fa-solid fa-spinner"></i>
            </div>
            <p class="text-base font-bold text-slate-800">Menghubungkan ke Cloud...</p>
            <p class="text-xs text-slate-500 mt-1">Mohon tunggu sebentar, sedang sinkronisasi data produk & toko.</p>
        </div>
    </div>

    <!-- HALAMAN LOGIN (Jika belum login) -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
                <div class="text-center mb-8">
                    <div class="bg-blue-100 text-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                        <i class="fa-solid fa-cash-register"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-900">POS ATK & Percetakan</h1>
                    <p class="text-sm text-slate-500 mt-1">Silakan masuk menggunakan akun Anda</p>
                </div>

                <form @submit.prevent="handleLogin" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                        <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan username">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan password">
                    </div>
                    <template x-if="loginError">
                        <p class="text-sm text-red-600 font-medium text-center" x-text="loginError"></p>
                    </template>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
                        Masuk Sistem
                    </button>
                </form>
                
                <div class="mt-6 text-center text-xs text-slate-400">
                    Default Owner: <span class="font-semibold">owner</span> / <span class="font-semibold">123</span> | Karyawan: <span class="font-semibold">kasir</span> / <span class="font-semibold">123</span>
                </div>
            </div>
        </div>
    </template>
<!-- Indikator Online / Offline -->
<div class="flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-medium border"
     :class="isOnline ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-700 border-red-200'">
    <span class="w-2.5 h-2.5 rounded-full animate-pulse"
          :class="isOnline ? 'bg-green-500' : 'bg-red-500'"></span>
    <span x-text="isOnline ? 'Online (Live Sync)' : 'Offline (Mode Lokal)'"></span>
</div>
    <!-- HALAMAN UTAMA APLIKASI (Jika sudah login) -->
    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            
            <!-- NAVBAR -->
            <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-30">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="bg-blue-600 text-white p-2 rounded-lg">
                            <i class="fa-solid fa-store text-lg"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-slate-900 text-base sm:text-lg leading-tight" x-text="storeProfile.name"></h1>
                            <p class="text-xs text-slate-500">Sistem Kasir & Toko</p>
                        </div>
                    </div>

                    <!-- Navigasi Tab -->
                    <nav class="flex space-x-1 sm:space-x-2">
                        <button @click="changeTab('kasir')" :class="activeTab === 'kasir' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-100'" class="px-3 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                            <i class="fa-solid fa-cash-register"></i>
                            <span class="hidden md:inline">Kasir</span>
                        </button>
                        <button @click="changeTab('produk')" :class="activeTab === 'produk' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-100'" class="px-3 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            <span class="hidden md:inline">Produk</span>
                        </button>
                        <button @click="changeTab('laporan')" :class="activeTab === 'laporan' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-100'" class="px-3 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                            <i class="fa-solid fa-chart-line"></i>
                            <span class="hidden md:inline">Laporan</span>
                        </button>
                        <button @click="changeTab('setting')" :class="activeTab === 'setting' ? 'bg-blue-50 text-blue-600' : 'text-slate-600 hover:bg-slate-100'" class="px-3 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                            <i class="fa-solid fa-gear"></i>
                            <span class="hidden md:inline">Pengaturan</span>
                        </button>
                    </nav>

                    <!-- Profil & Logout -->
                    <div class="flex items-center space-x-3 border-l pl-4 border-slate-200">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-semibold text-slate-800" x-text="currentUser.name"></p>
                            <span class="text-xs uppercase px-1.5 py-0.5 rounded font-bold" :class="currentUser.role === 'owner' ? 'bg-purple-100 text-purple-700' : 'bg-emerald-100 text-emerald-700'" x-text="currentUser.role"></span>
                        </div>
                        <button @click="logout" title="Keluar" class="bg-red-50 text-red-600 hover:bg-red-100 p-2 rounded-lg transition">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- WARNING AKSES KARYAWAN -->
            <template x-if="authWarning">
                <div class="bg-amber-50 border-l-4 border-amber-500 p-4 max-w-7xl mx-auto w-full mt-4 flex justify-between items-center no-print">
                    <p class="text-sm text-amber-700" x-text="authWarning"></p>
                    <button @click="authWarning = ''" class="text-amber-500 hover:text-amber-700">&times;</button>
                </div>
            </template>

            <!-- KONTEN UTAMA -->
            <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
                
                <!-- TAB 1: KASIR (POS) -->
                <div x-show="activeTab === 'kasir'" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <!-- Kolom Kiri: Produk & Pencarian -->
                    <div class="lg:col-span-7 flex flex-col space-y-4">
                        <!-- Barcode & Search Box -->
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Scan Barcode Cepat</label>
                                <form @submit.prevent="handleBarcodeScan">
                                    <input type="text" x-model="barcodeInput" placeholder="Scan barcode produk di sini lalu Enter..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                </form>
                            </div>
                            <div class="flex flex-col sm:flex-row gap-2">
                                <div class="relative flex-1">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </span>
                                    <input type="text" x-model="searchQuery" placeholder="Cari nama produk..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <select x-model="selectedCategory" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                    <option value="semua">Semua Kategori</option>
                                    <option value="atk">ATK / Barang</option>
                                    <option value="cetak">Jasa Percetakan</option>
                                </select>
                            </div>
                        </div>

                        <!-- Daftar Produk Grid -->
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex-1 min-h-[400px]">
                            <h2 class="text-sm font-bold text-slate-700 uppercase mb-3">Pilih Produk</h2>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto max-h-[500px] pr-1">
                                <template x-for="product in filteredProducts" :key="product.id">
                                    <div @click="addToCart(product)" class="border border-slate-200 rounded-xl p-3 flex flex-col justify-between hover:border-blue-500 hover:shadow-md cursor-pointer transition bg-slate-50/50 group">
                                        <div>
                                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase" :class="product.category === 'atk' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'" x-text="product.category"></span>
                                            <h3 class="text-sm font-semibold text-slate-800 mt-2 line-clamp-2 group-hover:text-blue-600 transition" x-text="product.name"></h3>
                                        </div>
                                        <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between">
                                            <span class="text-xs font-bold text-blue-600" x-text="formatRupiah(product.price)"></span>
                                            <span class="text-[11px] text-slate-400" x-show="product.category === 'atk'">Stok: <span x-text="product.stock"></span></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Kolom Kanan: Keranjang & Pembayaran -->
                    <div class="lg:col-span-5 flex flex-col space-y-4">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col h-full justify-between">
                            <div>
                                <div class="flex items-center justify-between border-b pb-3 mb-3">
                                    <h2 class="text-sm font-bold text-slate-700 uppercase">Keranjang Belanja</h2>
                                    <button @click="cart = []" x-show="cart.length > 0" class="text-xs text-red-500 hover:text-red-700 font-medium">Kosongkan</button>
                                </div>

                                <!-- Item Keranjang -->
                                <div class="space-y-3 overflow-y-auto max-h-[220px] pr-1 mb-4">
                                    <template x-if="cart.length === 0">
                                        <div class="text-center py-8 text-slate-400 text-sm">
                                            <i class="fa-solid fa-cart-shopping text-3xl mb-2 opacity-30"></i>
                                            <p>Keranjang masih kosong</p>
                                        </div>
                                    </template>
                                    <template x-for="(item, index) in cart" :key="item.id">
                                        <div class="flex items-center justify-between bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                                            <div class="flex-1 pr-2">
                                                <h4 class="text-xs font-bold text-slate-800" x-text="item.name"></h4>
                                                <p class="text-xs text-blue-600 font-semibold mt-0.5" x-text="formatRupiah(item.price)"></p>
                                            </div>
                                            <div class="flex items-center space-x-2">
                                                <div class="flex items-center border border-slate-300 rounded bg-white">
                                                    <button @click="updateQty(index, -1)" class="px-2 py-0.5 text-slate-600 hover:bg-slate-100 text-xs">-</button>
                                                    <span class="px-2 text-xs font-semibold" x-text="item.qty"></span>
                                                    <button @click="updateQty(index, 1)" class="px-2 py-0.5 text-slate-600 hover:bg-slate-100 text-xs">+</button>
                                                </div>
                                                <button @click="removeFromCart(index)" class="text-slate-400 hover:text-red-500 text-xs p-1">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <!-- Data Pelanggan (Tekan Enter langsung proses jika metode non-tunai atau data lengkap) -->
                                <div class="space-y-2 border-t pt-3 border-slate-200">
                                    <div class="grid grid-cols-2 gap-2">
                                        <input type="text" x-model="customer.name" @keydown.enter="checkout()" placeholder="Nama Pelanggan (Opsional)" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                        <input type="text" x-model="customer.phone" @keydown.enter="checkout()" placeholder="No HP / WhatsApp" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                    </div>
                                </div>
                            </div>

                            <!-- Total & Tombol Checkout -->
                            <div class="border-t pt-4 mt-4 border-slate-200 space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm font-medium text-slate-600">Total Tagihan:</span>
                                    <span class="text-xl font-bold text-blue-600" x-text="formatRupiah(grandTotal)"></span>
                                </div>

                                <!-- Metode Pembayaran -->
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Metode Pembayaran</label>
                                    <div class="grid grid-cols-3 gap-2">
                                        <button @click="paymentMethod = 'tunai'" :class="paymentMethod === 'tunai' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300'" class="py-1.5 text-xs font-semibold rounded-lg border transition">Tunai</button>
                                        <button @click="paymentMethod = 'qris'" :class="paymentMethod === 'qris' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300'" class="py-1.5 text-xs font-semibold rounded-lg border transition">QRIS</button>
                                        <button @click="paymentMethod = 'transfer'" :class="paymentMethod === 'transfer' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-700 border-slate-300'" class="py-1.5 text-xs font-semibold rounded-lg border transition">Transfer</button>
                                    </div>
                                </div>

                                <!-- Input Tunai dengan Trigger Enter -->
                                <template x-if="paymentMethod === 'tunai'">
                                    <div class="space-y-1">
                                        <label class="block text-xs font-semibold text-slate-500">Jumlah Uang Diterima (Cash)</label>
                                        <input type="number" x-model.number="cash" @keydown.enter="checkout()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan nominal uang...">
                                        <div class="flex justify-between items-center text-xs pt-1">
                                            <span class="text-slate-500">Kembalian:</span>
                                            <span class="font-bold" :class="change >= 0 ? 'text-emerald-600' : 'text-red-600'" x-text="formatRupiah(change)"></span>
                                        </div>
                                    </div>
                                </template>

                                <button @click="checkout" :disabled="cart.length === 0 || (paymentMethod === 'tunai' && change < 0)" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-2.5 rounded-xl transition duration-200 shadow-md text-sm flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-check"></i>
                                    <span>Proses Transaksi & Cetak Nota</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
<!-- TAB 2: PRODUK -->
<div x-show="activeTab === 'produk'" class="space-y-6">
    <!-- Form Tambah Produk (Khusus Owner) -->
    <template x-if="currentUser.role === 'owner'">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-plus-circle text-blue-600"></i>
                <span>Tambah Produk / Jasa Baru</span>
            </h2>
            <form @submit.prevent="addProduct" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Barcode / Kode</label>
                    <input type="text" x-model="newProduct.barcode" placeholder="Opsional" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="lg:col-span-2">
                    <label class="block text-xs font-medium text-slate-700 mb-1">Nama Produk / Jasa</label>
                    <input type="text" x-model="newProduct.name" required placeholder="Contoh: Buku Sidu" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Kategori</label>
                    <select x-model="newProduct.category" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="atk">ATK / Barang</option>
                        <option value="cetak">Jasa Percetakan</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Harga Modal</label>
                    <input type="number" x-model.number="newProduct.purchasePrice" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Harga Jual</label>
                    <input type="number" x-model.number="newProduct.price" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Stok Awal</label>
                    <input type="number" x-model.number="newProduct.stock" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="sm:col-span-2 lg:col-span-6 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg text-sm transition shadow-sm">
                        Simpan Produk
                    </button>
                </div>
            </form>
        </div>
    </template>

    <!-- Form Tambah Stok Barang Cepat / Restock (Khusus Owner) -->
    <template x-if="currentUser.role === 'owner'">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center space-x-2">
                <i class="fa-solid fa-boxes-stacked text-emerald-600"></i>
                <span>Tambah / Restock Stok Barang</span>
            </h2>
            <form @submit.prevent="restockProduct" class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Barcode atau Nama Barang</label>
                    <input type="text" x-model="restockForm.keyword" required placeholder="Scan barcode / ketik nama..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Jumlah Stok yang Ditambahkan</label>
                    <input type="number" x-model.number="restockForm.addStock" min="1" required placeholder="Contoh: 10" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-lg text-sm transition shadow-sm">
                        <i class="fa-solid fa-plus mr-1"></i> Akumulasi Stok
                    </button>
                </div>
            </form>
        </div>
    </template>

    <!-- Tabel Daftar Produk -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center">
            <h2 class="text-base font-bold text-slate-800">Daftar Inventaris Produk & Jasa</h2>
            <span class="text-xs text-slate-500" x-text="products.length + ' item'"></span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                        <th class="p-3">Barcode</th>
                        <th class="p-3">Nama Produk</th>
                        <th class="p-3">Kategori</th>
                        <th class="p-3">Harga Modal</th>
                        <th class="p-3">Harga Jual</th>
                        <th class="p-3">Stok</th>
                        <template x-if="currentUser.role === 'owner'">
                            <th class="p-3 text-center">Aksi</th>
                        </template>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 text-sm">
                    <template x-for="(product, index) in products" :key="product.id">
                        <tr class="hover:bg-slate-50/50">
                            <td class="p-3 font-mono text-xs text-slate-600" x-text="product.barcode || '-'"></td>
                            <td class="p-3 font-semibold text-slate-800" x-text="product.name"></td>
                            <td class="p-3">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase" :class="product.category === 'atk' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700'" x-text="product.category"></span>
                            </td>
                            <td class="p-3 text-slate-600" x-text="formatRupiah(product.purchasePrice)"></td>

    <!-- JAVASCRIPT LOGIC (Alpine.js Data & Methods) -->
    <script>
    function posApp() {
        let todayObj = new Date();
        let yyyy = todayObj.getFullYear();
        let mm = String(todayObj.getMonth() + 1).padStart(2, '0');
        let dd = String(todayObj.getDate()).padStart(2, '0');

        return {
            // === KONFIGURASI CLOUD GOOGLE SHEETS ===
            loading: false,
            webAppUrl: 'https://script.google.com/macros/s/AKfycbyrcAYgFXJ4PrCnqYqYYMAkSauWQXmBRyP3c7RCeT8BSdMehnXZqInScR54bANASfcVRg/exec',

            // === VARIABEL STATUS KONEKSI (BARU) ===
            isOnline: navigator.onLine,

            isLoggedIn: localStorage.getItem('pos_logged_in') === 'true',
            currentUser: JSON.parse(localStorage.getItem('pos_current_user')) || { name: '', role: '' },
            loginForm: { username: '', password: '' },
            loginError: '',
            authWarning: '',
            modalMessage: '',
            activeReceipt: null,

            activeTab: 'kasir',
            searchQuery: '',
            barcodeInput: '',
            selectedCategory: 'semua',
            paymentMethod: 'tunai',
            cash: 0,
            
            customer: {
                name: '',
                phone: ''
            },

            reportFilterType: 'semua',
            filterDate: `${yyyy}-${mm}-${dd}`,
            filterMonth: `${yyyy}-${mm}`,
            filterYear: yyyy,
            filterCashier: 'semua',

            // Data awal dikosongkan/diambil dari cloud nanti lewat init()
            products: [],
            cart: [],
            transactions: [],
            newProduct: { barcode: '', name: '', category: 'atk', purchasePrice: 0, price: 0, stock: 0 },
            
            restockForm: { keyword: '', addStock: 0 },

            storeProfile: {
                name: 'Memuat...',
                address: '',
                phone: '',
                footerMessage: ''
            },

            employees: [
                 { id: 1, username: 'afifah', name: 'owner toko', role: 'owner', password: '234' },
                 { id: 2, username: 'khusnul', name: 'khusnul', role: 'karyawan', password: '123' }
            ],

            newEmployee: { username: '', name: '', password: '123', role: 'karyawan' },

            // === FUNGSI INIT (DIPERBARUI DENGAN LISTENER KONEKSI) ===
            async init() {
                // Pasang event listener untuk deteksi online/offline browser
                window.addEventListener('online', () => { this.isOnline = true; });
                window.addEventListener('offline', () => { this.isOnline = false; });
                
                // Opsional: Cek berkala koneksi ke server Apps Script (tiap 30 detik)
                setInterval(() => {
                    this.pingServer();
                }, 30000);

                await this.fetchDataFromCloud();
            },

            // === FUNGSI PENGECEKAN KONEKSI SERVER (BARU) ===
            async pingServer() {
                if (!navigator.onLine) {
                    this.isOnline = false;
                    return;
                }
                try {
                    // Menggunakan mode no-cors untuk melakukan ping ringan ke Web App URL
                    await fetch(this.webAppUrl + '?action=ping', { method: 'GET', mode: 'no-cors' });
                    this.isOnline = true;
                } catch (err) {
                    this.isOnline = false;
                }
            },

            // === FUNGSI AMBIL DATA DARI GOOGLE SHEETS ===
            async fetchDataFromCloud() {
                this.loading = true;
                try {
                    let response = await fetch(this.webAppUrl + '?action=getData');
                    let result = await response.json();
                    
                    this.products = result.products || [];
                    this.transactions = result.transactions || [];
                    
                    if (result.employees && result.employees.length > 0) {
                        this.employees = result.employees;
                    }
                    
                    this.storeProfile = result.storeProfile || this.storeProfile;
                    this.isOnline = true; // Berhasil terhubung ke cloud
                } catch (error) {
                    console.error('Gagal memuat data dari cloud:', error);
                    this.isOnline = false; // Gagal terhubung
                    this.modalMessage = 'Gagal terhubung ke database cloud!';
                } finally {
                    this.loading = false;
                }
            },

            handleLogin() {
                this.loginError = '';
                let u = this.loginForm.username.trim().toLowerCase();
                let p = this.loginForm.password.trim();

                let foundEmp = this.employees.find(e => e.username.toLowerCase() === u && e.password == p);

                if (foundEmp) {
                    this.currentUser = { name: foundEmp.name, role: foundEmp.role };
                    this.finishLogin();
                } else {
                    this.loginError = 'Username atau password salah!';
                }
            },

            // === FUNGSI TAMBAH PRODUK KE CLOUD ===
            async addProduct() {
                if (this.currentUser.role !== 'owner') {
                    this.modalMessage = 'Hanya owner yang dapat menambah produk!';
                    return;
                }
                if (!this.newProduct.name || this.newProduct.price <= 0) {
                    this.modalMessage = 'Nama produk dan harga jual harus diisi!';
                    return;
                }

                // Buat ID unik berbasis waktu
                this.newProduct.id = 'PRD-' + Date.now();

                // Masukkan ke array lokal sementara
                this.products.push({ ...this.newProduct });

                // Kirim ke Google Apps Script
                try {
                    let response = await fetch(this.webAppUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'addProduct',
                            product: this.newProduct
                        })
                    });
                    let res = await response.json();
                    if (res.status === 'success') {
                        this.modalMessage = 'Produk berhasil disimpan ke Cloud Google Sheets!';
                    } else {
                        this.modalMessage = 'Gagal menyimpan ke cloud: ' + res.message;
                    }
                } catch (err) {
                    console.error('Error:', err);
                    this.modalMessage = 'Terjadi kesalahan koneksi ke cloud.';
                }

                // Reset form
                this.newProduct = { barcode: '', name: '', category: 'atk', purchasePrice: 0, price: 0, stock: 0 };
            },
            
            finishLogin() {
                this.isLoggedIn = true;
                localStorage.setItem('pos_logged_in', 'true');
                localStorage.setItem('pos_current_user', JSON.stringify(this.currentUser));
                this.loginForm = { username: '', password: '' };
                this.activeTab = 'kasir';
                this.authWarning = '';
            },

            logout() {
                this.isLoggedIn = false;
                this.currentUser = { name: '', role: '' };
                localStorage.removeItem('pos_logged_in');
                localStorage.removeItem('pos_current_user');
                this.cart = [];
                this.cash = 0;
                this.paymentMethod = 'tunai';
            },

            changeTab(tabName) {
                if (this.currentUser.role === 'karyawan' && (tabName === 'produk' || tabName === 'laporan' || tabName === 'setting')) {
                    this.authWarning = 'Akses ditolak! Akun Karyawan hanya dapat mengakses tab Kasir.';
                    this.activeTab = 'kasir';
                    return;
                }
                this.authWarning = '';
                this.activeTab = tabName;
            },

            get filteredProducts() {
                return this.products.filter(p => {
                    let matchesCategory = this.selectedCategory === 'semua' || p.category === this.selectedCategory;
                    let matchesSearch = p.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || 
                                        (p.barcode && p.barcode.toLowerCase().includes(this.searchQuery.toLowerCase()));
                    return matchesCategory && matchesSearch;
                });
            },

            handleBarcodeScan() {
                if (!this.barcodeInput.trim()) return;
                let code = this.barcodeInput.trim().toLowerCase();
                let found = this.products.find(p => p.barcode && p.barcode.toLowerCase() === code);

                if (found) {
                    this.addToCart(found);
                    this.barcodeInput = '';
                } else {
                    this.modalMessage = `Produk dengan barcode "${this.barcodeInput}" tidak ditemukan!`;
                    this.barcodeInput = '';
                }
            },

            get grandTotal() {
                return this.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            },

            get change() {
                return this.cash - this.grandTotal;
            },

            get availableYears() {
                let years = [new Date().getFullYear()];
                this.transactions.forEach(tx => {
                    let yr = new Date(tx.id).getFullYear();
                    if (!years.includes(yr)) years.push(yr);
                });
                return years.sort((a,b) => b - a);
            },

            get filteredTransactions() {
                return this.transactions.filter(tx => {
                    let txDateObj = new Date(tx.id);
                    let tYear = txDateObj.getFullYear();
                    let tMonth = String(txDateObj.getMonth() + 1).padStart(2, '0');
                    let tDay = String(txDateObj.getDate()).padStart(2, '0');
                    let txDateStr = `${tYear}-${tMonth}-${tDay}`;
                    let txMonthStr = `${tYear}-${tMonth}`;

                    let matchesDate = true;
                    if (this.reportFilterType === 'tanggal') {
                        matchesDate = (txDateStr === this.filterDate);
                    } else if (this.reportFilterType === 'bulan') {
                        matchesDate = (txMonthStr === this.filterMonth);
                    } else if (this.reportFilterType === 'tahun') {
                        matchesDate = (tYear.toString() === this.filterYear.toString());
                    }

                    let matchesCashier = this.filterCashier === 'semua' || (tx.cashierName && tx.cashierName.toLowerCase() === this.filterCashier.toLowerCase());

                    return matchesDate && matchesCashier;
                });
            },

            get topSellingItems() {
                let itemSales = {};
                
                this.filteredTransactions.forEach(tx => {
                    tx.items.forEach(item => {
                        if (!itemSales[item.name]) {
                            itemSales[item.name] = 0;
                        }
                        itemSales[item.name] += item.qty;
                    });
                });

                let sortedArray = Object.keys(itemSales).map(name => {
                    return { name: name, qty: itemSales[name] };
                });

                sortedArray.sort((a, b) => b.qty - a.qty);
                return sortedArray.slice(0, 5);
            },

            get outOfStockItems() {
                return this.products.filter(p => p.category === 'atk' && p.stock === 0);
            },

            get lowStockItems() {
                return this.products.filter(p => p.category === 'atk' && p.stock > 0 && p.stock <= 5);
            },

            get filteredRevenue() {
                return this.filteredTransactions.reduce((sum, tx) => sum + tx.total, 0);
            },

            calculateTxProfit(tx) {
                return tx.items.reduce((sum, item) => {
                    let modal = item.purchasePrice || 0;
                    return sum + ((item.price - modal) * item.qty);
                }, 0);
            },

            get filteredProfit() {
                return this.filteredTransactions.reduce((sum, tx) => sum + this.calculateTxProfit(tx), 0);
            },

            get filteredModal() {
                return this.filteredTransactions.reduce((sumTx, tx) => {
                    let txModal = tx.items.reduce((sumItem, item) => {
                        let modalItem = item.purchasePrice || 0;
                        return sumItem + (modalItem * item.qty);
                    }, 0);
                    return sumTx + txModal;
                }, 0);
            },

            get availableCashiers() {
                let cashiers = [];
                this.transactions.forEach(tx => {
                    if (tx.cashierName && !cashiers.includes(tx.cashierName)) {
                        cashiers.push(tx.cashierName);
                    }
                });
                return cashiers;
            },

            resetFilter() {
                this.reportFilterType = 'semua';
                this.filterCashier = 'semua';
            },

            formatRupiah(value) {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(value);
            },

            addToCart(product) {
                let existing = this.cart.find(item => item.id === product.id);
                if (existing) {
                    existing.qty++;
                } else {
                    this.cart.push({ ...product, qty: 1, note: '' });
                }
            },

            updateQty(index, amount) {
                this.cart[index].qty += amount;
                if (this.cart[index].qty <= 0) {
                    this.cart.splice(index, 1);
                }
            },

            removeFromCart(index) {
                this.cart.splice(index, 1);
            },

            // === FUNGSI CHECKOUT (Kirim ke Google Sheets) ===
            async checkout() {
                if (this.cart.length === 0) {
                    this.modalMessage = 'Keranjang belanja masih kosong!';
                    return;
                }
                if (this.paymentMethod === 'tunai' && this.change < 0) {
                    this.modalMessage = 'Jumlah uang tunai kurang dari total tagihan!';
                    return;
                }

                let newTx = {
                    id: Date.now(),
                    date: new Date().toLocaleString('id-ID'),
                    method: this.paymentMethod,
                    cashierName: this.currentUser.name || 'Kasir',
                    customerName: this.customer.name.trim() ? this.customer.name.trim() : 'Umum',
                    customerPhone: this.customer.phone.trim() ? this.customer.phone.trim() : '-',
                    items: [...this.cart],
                    total: this.grandTotal,
                    cashPaid: this.paymentMethod === 'tunai' ? this.cash : this.grandTotal
                };

                this.modalMessage = 'Menyimpan transaksi ke cloud...';

                try {
                    let response = await fetch(this.webAppUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'saveTransaction',
                            tx: newTx
                        })
                    });

                    let result = await response.json();

                    if (result.status === 'success') {
                        this.transactions.unshift(newTx);

                        this.cart.forEach(cartItem => {
                            let prod = this.products.find(p => p.id === cartItem.id);
                            if (prod && prod.category === 'atk') {
                                prod.stock = Math.max(0, prod.stock - cartItem.qty);
                            }
                        });

                        this.printReceipt(newTx);

                        this.cart = [];
                        this.cash = 0;
                        this.paymentMethod = 'tunai';
                        this.customer = { name: '', phone: '' };
                        this.modalMessage = 'Transaksi berhasil disimpan ke cloud!';
                        this.isOnline = true;
                    } else {
                        this.modalMessage = 'Gagal menyimpan transaksi: ' + (result.message || 'Error');
                    }
                } catch (error) {
                    console.error('Error checkout:', error);
                    this.isOnline = false;
                    this.modalMessage = 'Terjadi kesalahan jaringan saat menyimpan transaksi.';
                }
            },

            printReceipt(tx) {
                this.activeReceipt = tx;
                setTimeout(() => {
                    window.print();
                }, 150);
            },

            saveStoreProfile() {
                localStorage.setItem('pos_store_profile', JSON.stringify(this.storeProfile));
                this.modalMessage = 'Profil toko berhasil diperbarui!';
            },

            addEmployee() {
                if (!this.newEmployee.username || !this.newEmployee.name) {
                    this.modalMessage = 'Username dan Nama Karyawan wajib diisi!';
                    return;
                }
                let exists = this.employees.find(e => e.username.toLowerCase() === this.newEmployee.username.toLowerCase());
                if (exists) {
                    this.modalMessage = 'Username sudah digunakan!';
                    return;
                }
                let newId = this.employees.length ? Math.max(...this.employees.map(e => e.id)) + 1 : 1;
                this.employees.push({ id: newId, ...this.newEmployee });
                this.newEmployee = { username: '', name: '', password: '123', role: 'karyawan' };
                this.modalMessage = 'Karyawan baru berhasil ditambahkan!';
            },

            deleteEmployee(index) {
                if (this.employees.length <= 1) {
                    this.modalMessage = 'Minimal harus ada 1 akun di dalam sistem!';
                    return;
                }
                this.employees.splice(index, 1);
                this.modalMessage = 'Akun karyawan berhasil dihapus.';
            },

            resetAllTransactions() {
                if (confirm('PERINGATAN: Semua riwayat transaksi lokal akan dibersihkan! Lanjutkan?')) {
                    this.transactions = [];
                    this.modalMessage = 'Riwayat transaksi dibersihkan dari tampilan.';
                }
            },

            deleteProduct(index) {
                if (this.currentUser.role !== 'owner') {
                    this.modalMessage = 'Hanya owner yang dapat menghapus produk!';
                    return;
                }
                this.products.splice(index, 1);
                this.modalMessage = 'Produk berhasil dihapus.';
            },
            // === FUNGSI SIMPAN PROFIL TOKO KE CLOUD (PERBARUI INI) ===
            async saveStoreProfile() {
                if (this.currentUser.role !== 'owner') {
                    this.modalMessage = 'Hanya owner yang dapat mengubah profil toko!';
                    return;
                }

                // Simpan ke localStorage juga untuk cache lokal
                localStorage.setItem('pos_store_profile', JSON.stringify(this.storeProfile));
                this.modalMessage = 'Menyimpan profil toko ke cloud...';

                try {
                    let response = await fetch(this.webAppUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'saveStoreProfile',
                            storeProfile: this.storeProfile
                        })
                    });
                    let res = await response.json();
                    if (res.status === 'success') {
                        this.modalMessage = 'Profil toko berhasil disimpan permanen ke Cloud Google Sheets!';
                        this.isOnline = true;
                    } else {
                        this.modalMessage = 'Gagal menyimpan ke cloud: ' + (res.message || 'Error');
                    }
                } catch (err) {
                    console.error('Error save store profile:', err);
                    this.isOnline = false;
                    this.modalMessage = 'Terjadi kesalahan jaringan saat menyimpan profil toko.';
                }
            },

            async restockProduct() {
                if (this.currentUser.role !== 'owner') {
                    this.modalMessage = 'Hanya owner yang dapat menambah stok!';
                    return;
                }

                let kw = String(this.restockForm.keyword || '').trim();
                let qtyToAdd = parseInt(this.restockForm.addStock) || 0;

                if (!kw || qtyToAdd <= 0) {
                    this.modalMessage = 'Masukkan barcode/nama barang dan jumlah stok tambahan yang valid!';
                    return;
                }

                let found = this.products.find(p => {
                    let bCode = p.barcode !== null && p.barcode !== undefined ? String(p.barcode).trim().toLowerCase() : '';
                    let pName = p.name !== null && p.name !== undefined ? String(p.name).trim().toLowerCase() : '';
                    let pId = String(p.id).trim();

                    return (bCode && bCode === kw.toLowerCase()) || 
                           (pName && pName.includes(kw.toLowerCase())) || 
                           (pId === kw);
                });

                if (found) {
                    if (found.category && found.category !== 'atk') {
                        this.modalMessage = `Produk "${found.name}" adalah jasa!`;
                        return;
                    }

                    // Update lokal agar responsif
                    found.stock = (Number(found.stock) || 0) + qtyToAdd;
                    let keywordUsed = found.barcode || found.name;

                    this.modalMessage = 'Menyimpan perubahan stok ke cloud...';

                    try {
                        let response = await fetch(this.webAppUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: 'updateStock',
                                keyword: keywordUsed,
                                addStock: qtyToAdd
                            })
                        });
                        let res = await response.json();
                        if (res.status === 'success') {
                            this.modalMessage = `Berhasil! Stok "${found.name}" bertambah ${qtyToAdd}. Total stok: ${found.stock}`;
                            this.isOnline = true;
                        } else {
                            this.modalMessage = 'Gagal sinkronisasi stok ke cloud: ' + res.message;
                        }
                    } catch (err) {
                        console.error('Error restock:', err);
                        this.isOnline = false;
                        this.modalMessage = 'Terjadi kesalahan jaringan saat update stok.';
                    }

                    this.restockForm = { keyword: '', addStock: 0 };
                } else {
                    this.modalMessage = `Produk dengan keyword "${this.restockForm.keyword}" tidak ditemukan!`;
                }
            },
        }
    }
</script>
